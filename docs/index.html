<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algonquin Weekend</title>
<meta name="description" content="Our Thanksgiving weekend in Huntsville and Algonquin Park: timeline, map, bookings, forecast and a trip assistant.">
<meta name="theme-color" content="#2F5A45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F5A45'/%3E%3Cpath d='M16 5l-3 6h2l-4 6h3l-5 7h14l-5-7h3l-4-6h2z' fill='%23F3F5EF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <main class="content">
    <header class="top">
      <span class="eyebrow" id="eyebrow">Thanksgiving weekend</span>
      <h1 id="title">Algonquin Weekend</h1>
      <p class="lede" id="lede">Loading the plan…</p>
      <div class="chips" id="chips"></div>
    </header>

    <div class="sticky">
      <div class="seg" role="tablist" aria-label="View">
        <button role="tab" class="seg-btn" data-view="sat" aria-selected="true">Saturday <small>Oct 10</small></button>
        <button role="tab" class="seg-btn" data-view="sun" aria-selected="false">Sunday <small>Oct 11</small></button>
        <button role="tab" class="seg-btn" data-view="prep" aria-selected="false">Prep <small id="prepCount"></small></button>
      </div>
    </div>

    <section id="dayView" class="view">
      <div class="glance" id="glance"></div>
      <div class="tl-head">
        <h2 id="dayTitle"></h2>
        <span class="hint">Tap a stop for details and to see it on the map</span>
      </div>
      <ol class="timeline" id="rows"></ol>
    </section>

    <section id="prepView" class="view" hidden>
      <div class="tl-head"><h2>Bookings</h2><span class="hint" id="bookedCount"></span></div>
      <div class="bookings" id="bookings"></div>
      <div id="prepLists"></div>
      <footer class="foot">
        <p id="footnote"></p>
        <p id="sources"></p>
      </footer>
    </section>
  </main>

  <aside class="mapcol" aria-label="Map">
    <div class="stage">
      <div id="map" class="map" role="region" aria-label="Map of the weekend route"></div>
      <div class="map-tools" role="toolbar" aria-label="Map">
        <button class="tool" id="fitBtn" title="Show the whole day">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg><span>Whole day</span>
        </button>
        <a class="tool" id="dayRoute" href="https://www.google.com/maps" target="_blank" rel="noopener" title="Open the day's route in Google Maps">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/></svg><span>Directions</span>
        </a>
      </div>
      <div class="map-caption" id="mapCaption"></div>
    </div>
  </aside>
</div>

<section class="cli" id="chat" data-open="false" aria-label="Trip assistant">
  <div class="cli-box">
    <div class="cli-log" id="chatLog" aria-live="polite"></div>
    <form class="cli-join" id="chatJoin" hidden>
      <span>Enter the access code:</span>
      <input id="joinCode" type="password" autocomplete="off" aria-label="Access code" placeholder="access code">
      <button type="submit">enter</button>
      <span class="cli-err" id="joinErr" role="alert"></span>
    </form>
    <form class="cli-input" id="chatForm">
      <span class="cli-prompt" aria-hidden="true">›</span>
      <textarea id="chatText" rows="1" placeholder="Ask about the trip" aria-label="Ask the trip assistant" maxlength="2000" spellcheck="false"></textarea>
      <kbd class="cli-kbd" id="chatKbd">⌘K</kbd>
      <button type="submit" class="cli-send" id="chatSend" aria-label="Send">↵</button>
    </form>
    <div class="cli-foot">
      <span class="cli-status" id="chatSub">connecting…</span>
      <span class="cli-keys">enter to send · esc to hide · /clear</span>
    </div>
  </div>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
